{% extends 'base.html' %}
{% block content %}
<div class="container py-4">
  <h2>Delete Customer</h2>
  <p>Are you sure you want to delete customer "{{ object.name }}"?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, Delete</button>
    <a href="{% url 'dashboard:customer_list' %}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
