{% extends 'base.html' %}
{% block content %}
<h2>Admin Login</h2>

{% if messages %}
  {% for message in messages %}
    <p class="text-danger">{{ message }}</p>
  {% endfor %}
{% endif %}

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Login</button>
</form>
{% endblock %}
