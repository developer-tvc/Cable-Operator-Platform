{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">
    <h2>Update Plan - {{ plan.name }}</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Update</button>
        <a href="{% url 'plan_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
