{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">
    <h2>Delete Plan</h2>
    <p>Are you sure you want to delete <strong>{{ plan.name }}</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
        <a href="{% url 'plan_list' %}" class="btn btn-secondary">No, Cancel</a>
    </form>
</div>
{% endblock %}
