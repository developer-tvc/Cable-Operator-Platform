<h2>Admin Dashboard</h2>
<table border="1">
    <tr>
        <th>Name</th>
        <th>Mobile</th>
        <th>Status</th>
        <th>Actions</th>
    </tr>
    {% for customer in customers %}
    <tr>
        <td>{{ customer.name }}</td>
        <td>{{ customer.mobile }}</td>
        <td>{{ customer.status }}</td>
        <td>
            <a href="{% url 'toggle_status' customer.id %}">Toggle Status</a> |
            <a href="{% url 'view_customer' customer.id %}">View</a>
        </td>
    </tr>
    {% endfor %}
</table>
